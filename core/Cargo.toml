[package]
name = "fs-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "sync"] }
tokio-stream = "0.1"
trash = "5"
walkdir = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
md5 = "0.8"
png = "0.18"
shlex = "1.3"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
# Pack and unpack (all pure Rust, so they work alike in the Flatpak, the
# AppImage and on Windows): tar, gzip, xz and 7z.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = "0.22"
sevenz-rust2 = { version = "0.24", features = ["compress", "aes256"] }
# Network locations (sftp://, ftp://, ftps://) in pure Rust, so they work the
# same on every distribution and inside the Flatpak/AppImage: `ring` instead
# of aws-lc (no C/CMake toolchain), rustls instead of OpenSSL.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
suppaftp = { version = "12", features = ["tokio-rustls-ring"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
tempfile = "3"

# Saved connection passwords go to the system keyring (Secret Service:
# GNOME Keyring, KWallet), or the Secret portal inside the Flatpak.
[target.'cfg(unix)'.dependencies]
oo7 = "0.6"
# Drive size and free space (statvfs) for Folder Size.
libc = "0.2"

# Drive letters for the drive menu; saved passwords in the Credential
# Manager.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }
