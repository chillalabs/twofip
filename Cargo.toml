[workspace]
resolver = "2"
members = ["app", "core"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/chillalabs/twofip"

[profile.dev]
# libcosmic/wgpu son pesados de compilar en debug sin esto
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Smaller, faster binary for installing: no debug symbols, cross-crate
# optimization ("thin" LTO keeps build times reasonable with libcosmic).
strip = true
lto = "thin"
